services:
  - type: web
    name: planilha-siloms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # O comando abaixo so vale para servicos criados por Blueprint.
    # Um servico criado pelo painel usa o comando guardado la -- por isso a
    # configuracao de verdade do gunicorn esta em gunicorn.conf.py, que o
    # gunicorn le sozinho em qualquer um dos dois casos.
    startCommand: gunicorn app:app
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.6"
